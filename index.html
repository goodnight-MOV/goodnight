<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodNight 🌙 | مشاهدة أفلام ومسلسلات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0e1117;
            --bg-card: #181c26;
            --red-primary: #c81919;
            --red-hover: #e50914;
            --blue-accent: #1e293b;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --gold: #f5c518;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 1. Top Red Bar */
        .top-nav {
            background-color: var(--red-primary);
            padding: 0.6rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .top-links {
            display: flex;
            gap: 18px;
            list-style: none;
        }

        .top-links a {
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .top-links a:hover {
            opacity: 0.8;
        }

        .social-pill {
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 14px;
            border-radius: 20px;
            display: flex;
            gap: 12px;
            color: #fff;
            font-size: 0.85rem;
        }

        /* 2. Main Brand & Search Area */
        .brand-header {
            background-color: #121620;
            padding: 1.8rem 1rem;
            text-align: center;
            border-bottom: 2px solid #1c2230;
        }

        .site-logo {
            font-size: 2.8rem;
            font-weight: 900;
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            display: inline-block;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        .site-logo span {
            color: var(--red-primary);
        }

        .search-container {
            max-width: 650px;
            margin: 0 auto;
            position: relative;
            display: flex;
            align-items: center;
            background: #090c12;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            overflow: hidden;
            padding: 3px;
        }

        .search-container input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 0.7rem 1.2rem;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .search-container button {
            background: var(--red-primary);
            color: #fff;
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 25px;
            font-weight: 900;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-container button:hover {
            background: var(--red-hover);
        }

        .main-container {
            max-width: 1380px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        /* 3. Featured Slider Section */
        .slider-section {
            position: relative;
            margin-bottom: 2rem;
            overflow: hidden;
            border-radius: 14px;
        }

        .slider-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding-bottom: 10px;
        }

        .slider-container::-webkit-scrollbar {
            display: none;
        }

        .slide-card {
            min-width: 260px;
            height: 380px;
            background: var(--bg-card);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .slide-card:hover {
            transform: scale(1.02);
        }

        .slide-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-ep {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--red-primary);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .slide-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
            padding: 1.2rem 0.8rem 0.8rem;
            text-align: center;
        }

        .slide-title {
            font-size: 0.95rem;
            font-weight: 900;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: var(--red-primary);
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: none;
        }

        .arrow-left { left: 10px; }
        .arrow-right { right: 10px; }

        /* 4. Quick Action Buttons Grid */
        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 2rem;
        }

        .quick-btn {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.8rem 1rem;
            border-radius: 12px;
            color: #fff;
            font-weight: 900;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-btn:hover {
            background: var(--red-primary);
            border-color: var(--red-primary);
        }

        .quick-btn.active {
            background: var(--red-primary);
        }

        /* 5. Filter Dropdowns Card */
        .filter-box {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 1.2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .filter-select {
            width: 100%;
            background: #0d1017;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 0.7rem 1rem;
            border-radius: 10px;
            outline: none;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .filter-select:focus {
            border-color: var(--red-primary);
        }

        /* 6. Content Section & Grid */
        .section-header-title {
            font-size: 1.4rem;
            font-weight: 900;
            margin-bottom: 1.2rem;
            border-right: 4px solid var(--red-primary);
            padding-right: 10px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 1.2rem;
        }

        .content-card {
            background: var(--bg-card);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .content-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 20px rgba(200, 25, 25, 0.25);
        }

        .card-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--red-primary);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 4px;
            z-index: 5;
        }

        .poster-img {
            width: 100%;
            height: 255px;
            object-fit: cover;
        }

        .card-body {
            padding: 0.8rem;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
        }

        .card-rating {
            color: var(--gold);
            font-weight: 900;
        }

        .load-more-btn {
            display: block;
            margin: 2.5rem auto;
            background: var(--bg-card);
            color: #fff;
            border: 2px solid var(--red-primary);
            padding: 0.7rem 3rem;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .load-more-btn:hover {
            background: var(--red-primary);
            box-shadow: 0 0 15px rgba(200, 25, 25, 0.4);
        }

        /* 7. Modal Player Window */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background: var(--bg-card);
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            border-radius: 14px;
            overflow-y: auto;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            z-index: 10;
        }

        .player-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }

        .player-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        .controls-bar {
            padding: 0.8rem 1.2rem;
            background: #0d1017;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls-bar select {
            background: var(--bg-card);
            color: #fff;
            border: 1px solid var(--red-primary);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-details {
            padding: 1.5rem;
        }

        .meta-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0.8rem 0 1.2rem 0;
        }

        .meta-pill {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.83rem;
            font-weight: bold;
            color: var(--red-primary);
        }

        .meta-row {
            margin-bottom: 0.6rem;
            font-size: 0.92rem;
            color: var(--text-muted);
        }

        .meta-row strong {
            color: #fff;
            margin-left: 6px;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: #080a0e;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <!-- 1. Top Red Bar -->
    <div class="top-nav">
        <ul class="top-links">
            <li><a onclick="resetToHome()">الرئيسية</a></li>
            <li><a onclick="filterCategory('movie')">أفلام</a></li>
            <li><a onclick="filterCategory('tv')">مسلسلات</a></li>
            <li><a onclick="filterCategory('anime')">أنمي</a></li>
            <li><a onclick="filterCategory('tv', '', '', '', '213', 'محتوى نتفليكس')">نتفليكس</a></li>
        </ul>
        <div class="social-pill">
            <span>GoodNight TV</span>
        </div>
    </div>

    <!-- 2. Main Brand & Search -->
    <div class="brand-header">
        <a class="site-logo" onclick="resetToHome()">Good<span>Night</span></a>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل...">
            <button onclick="performSearch()">بحث</button>
        </div>
    </div>

    <div class="main-container">

        <!-- 3. Featured Slider (الأحدث والحلقات) -->
        <div class="slider-section">
            <button class="slider-arrow arrow-right" onclick="scrollSlider(300)">❯</button>
            <button class="slider-arrow arrow-left" onclick="scrollSlider(-300)">❮</button>
            <div class="slider-container" id="sliderContainer"></div>
        </div>

        <!-- 4. Quick Filter Buttons -->
        <div class="quick-buttons">
            <button class="quick-btn active" id="btnLatest" onclick="filterCategory('latest')">🔴 الأحدث</button>
            <button class="quick-btn" id="btnTop" onclick="filterCategory('movie', '', '', 'vote_average.desc')">⭐ الأعلى تقييماً</button>
            <button class="quick-btn" id="btnPopular" onclick="filterCategory('movie', '', '', 'popularity.desc')">👁️ الأكثر مشاهدة</button>
            <button class="quick-btn" id="btnAnime" onclick="filterCategory('anime')">🎌 قسم الأنمي</button>
        </div>

        <!-- 5. Filter Dropdowns Bar -->
        <div class="filter-box">
            <div class="filter-grid">
                <select class="filter-select" id="countrySelect" onchange="applyFilters(true)">
                    <option value="">كل الأقسام / الدول</option>
                    <option value="US">أجنبي / أمريكي</option>
                    <option value="KR">كوري</option>
                    <option value="TR">تركي</option>
                    <option value="IN">هندي</option>
                    <option value="JP">ياباني / أنمي</option>
                    <option value="EG,SA,AE,KW">عربي</option>
                </select>

                <select class="filter-select" id="genreSelect" onchange="applyFilters(true)">
                    <option value="">كل الأنواع والتصنيفات</option>
                    <option value="28">أكشن</option>
                    <option value="27">رعب</option>
                    <option value="35">كوميدي</option>
                    <option value="18">دراما</option>
                    <option value="80">جريمة</option>
                    <option value="878">خيال علمي</option>
                    <option value="16">أنيميشن</option>
                    <option value="10749">رومانسي</option>
                </select>

                <select class="filter-select" id="yearSelect" onchange="applyFilters(true)">
                    <option value="">كل السنوات</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                </select>

                <select class="filter-select" id="sortSelect" onchange="applyFilters(true)">
                    <option value="primary_release_date.desc">المضاف حديثاً</option>
                    <option value="popularity.desc">الأكثر شعبية</option>
                    <option value="vote_average.desc">الأعلى تقييماً</option>
                </select>
            </div>
        </div>

        <!-- 6. Content Grid -->
        <h2 class="section-header-title" id="gridTitle">المضاف حديثاً</h2>
        <div class="content-grid" id="moviesGrid"></div>

        <button class="load-more-btn" id="loadMoreBtn" onclick="loadNextPage()">تحميل المزيد 🔄</button>
    </div>

    <!-- 7. Modal Player Window -->
    <div class="modal" id="movieModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <div class="player-container">
                <iframe id="videoPlayer" src="" allowfullscreen></iframe>
            </div>

            <div class="controls-bar">
                <div class="control-group">
                    <label style="font-size: 0.85rem; color: var(--text-muted);">السيرفر:</label>
                    <select id="serverSelect" onchange="updatePlayerSrc()">
                        <option value="vidlink">سيرفر 1 (VidLink)</option>
                        <option value="vidsrc">سيرفر 2 (VidSrc)</option>
                        <option value="vidbinge">سيرفر 3 (VidBinge)</option>
                        <option value="embedsu">سيرفر 4 (Embed.su)</option>
                    </select>
                </div>

                <div id="tvControls" style="display: none; gap: 10px;">
                    <div class="control-group">
                        <label style="font-size: 0.85rem; color: var(--text-muted);">الموسم:</label>
                        <select id="seasonSelect" onchange="onSeasonChange()"></select>
                    </div>
                    <div class="control-group">
                        <label style="font-size: 0.85rem; color: var(--text-muted);">الحلقة:</label>
                        <select id="episodeSelect" onchange="updatePlayerSrc()"></select>
                    </div>
                </div>
            </div>

            <div class="modal-details">
                <h2 id="modalTitle" style="color: var(--red-primary); font-size: 1.5rem;"></h2>
                <div id="modalMeta"></div>
                <p id="modalOverview" style="margin-top: 0.8rem; color: var(--text-muted); line-height: 1.7;"></p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 GoodNight Movies & TV</p>
    </footer>

    <script>
        const API_KEY = 'aba2e861e0b78ab29d243dd20a9fa948'; 
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';

        let currentType = 'movie'; 
        let currentNetwork = '';
        let currentItem = null;
        let currentPage = 1;
        let isSearching = false;
        let currentSearchQuery = '';

        const moviesGrid = document.getElementById('moviesGrid');
        const sliderContainer = document.getElementById('sliderContainer');
        const searchInput = document.getElementById('searchInput');
        const movieModal = document.getElementById('movieModal');
        const videoPlayer = document.getElementById('videoPlayer');
        const modalTitle = document.getElementById('modalTitle');
        const modalOverview = document.getElementById('modalOverview');
        const modalMeta = document.getElementById('modalMeta');
        const gridTitle = document.getElementById('gridTitle');
        const serverSelect = document.getElementById('serverSelect');
        const seasonSelect = document.getElementById('seasonSelect');
        const episodeSelect = document.getElementById('episodeSelect');
        const tvControls = document.getElementById('tvControls');
        const countrySelect = document.getElementById('countrySelect');
        const genreSelect = document.getElementById('genreSelect');
        const yearSelect = document.getElementById('yearSelect');
        const sortSelect = document.getElementById('sortSelect');
        const loadMoreBtn = document.getElementById('loadMoreBtn');

        function scrollSlider(amount) {
            sliderContainer.scrollBy({ left: amount, behavior: 'smooth' });
        }

        async function loadSliderItems() {
            try {
                const res = await fetch(`${BASE_URL}/trending/all/week?api_key=${API_KEY}&language=ar-SA`);
                const data = await res.json();
                sliderContainer.innerHTML = '';
                
                data.results.slice(0, 10).forEach(item => {
                    if (!item.poster_path) return;
                    const title = item.title || item.name;
                    const mediaType = item.media_type || 'movie';
                    
                    const slide = document.createElement('div');
                    slide.className = 'slide-card';
                    slide.innerHTML = `
                        <div class="badge-ep">${mediaType === 'tv' ? 'مسلسل' : 'فيلم'}</div>
                        <img src="${IMG_URL + item.poster_path}" alt="${title}">
                        <div class="slide-info">
                            <div class="slide-title">${title}</div>
                        </div>
                    `;
                    slide.onclick = () => {
                        currentType = mediaType;
                        openPlayer(item);
                    };
                    sliderContainer.appendChild(slide);
                });
            } catch (e) {
                console.error('Slider load error:', e);
            }
        }

        function filterCategory(type, country = '', genre = '', sort = '', network = '', customTitle = '') {
            currentNetwork = network;

            // Update Active Quick Buttons
            document.querySelectorAll('.quick-btn').forEach(btn => btn.classList.remove('active'));
            if (type === 'latest') document.getElementById('btnLatest').classList.add('active');

            if (customTitle) {
                currentType = type;
                gridTitle.innerText = customTitle;
            } else if (type === 'latest') {
                currentType = 'movie';
                sortSelect.value = 'primary_release_date.desc';
                gridTitle.innerText = "المضاف حديثاً";
            } else if (type === 'anime') {
                currentType = 'tv';
                genreSelect.value = '16';
                countrySelect.value = 'JP';
                gridTitle.innerText = "قسم الأنمي";
            } else {
                currentType = type;
                gridTitle.innerText = type === 'movie' ? "الأفلام" : "المسلسلات";
            }

            if (country) countrySelect.value = country; else countrySelect.value = '';
            if (genre) genreSelect.value = genre; else if (type !== 'anime') genreSelect.value = '';
            if (sort) sortSelect.value = sort;

            applyFilters(true);
        }

        function resetToHome() {
            currentNetwork = '';
            searchInput.value = '';
            countrySelect.value = '';
            genreSelect.value = '';
            yearSelect.value = '';
            sortSelect.value = 'primary_release_date.desc';
            filterCategory('latest');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function applyFilters(reset = true) {
            isSearching = false;
            if (reset) {
                currentPage = 1;
                moviesGrid.innerHTML = '';
            }

            const country = countrySelect.value;
            const genre = genreSelect.value;
            const year = yearSelect.value;
            const sort = sortSelect.value;
            const today = new Date().toISOString().split('T')[0];

            let url = `${BASE_URL}/discover/${currentType}?api_key=${API_KEY}&language=ar-SA&include_adult=false&sort_by=${sort}&page=${currentPage}`;
            
            if (currentType === 'movie') {
                url += `&primary_release_date.lte=${today}`;
            } else {
                url += `&first_air_date.lte=${today}`;
            }

            if (sort === 'vote_average.desc') {
                url += `&vote_count.gte=150`;
            } else if (sort === 'primary_release_date.desc') {
                url += `&vote_count.gte=20`;
            }

            if (currentNetwork) url += `&with_networks=${currentNetwork}`;
            if (country) url += `&with_origin_country=${country}`;
            if (genre) url += `&with_genres=${genre}`;
            if (year) {
                if (currentType === 'movie') url += `&primary_release_year=${year}`;
                else url += `&first_air_date_year=${year}`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                displayItems(data.results, reset);
                loadMoreBtn.style.display = data.page < data.total_pages ? 'block' : 'none';
            } catch (err) {
                console.error('Error applying filters:', err);
            }
        }

        function performSearch() {
            const query = searchInput.value.trim();
            if (query) searchItems(query, true);
        }

        async function searchItems(query, reset = true) {
            isSearching = true;
            currentSearchQuery = query;

            if (reset) {
                currentPage = 1;
                moviesGrid.innerHTML = '';
            }

            gridTitle.innerText = `نتائج البحث عن: ${query}`;
            try {
                const res = await fetch(`${BASE_URL}/search/${currentType}?api_key=${API_KEY}&language=ar-SA&query=${encodeURIComponent(query)}&page=${currentPage}&include_adult=false`);
                const data = await res.json();
                displayItems(data.results, reset);
                loadMoreBtn.style.display = data.page < data.total_pages ? 'block' : 'none';
            } catch (err) {
                console.error('Error searching:', err);
            }
        }

        function loadNextPage() {
            currentPage++;
            if (isSearching) {
                searchItems(currentSearchQuery, false);
            } else {
                applyFilters(false);
            }
        }

        function displayItems(items, reset = true) {
            if (reset && (!items || items.length === 0)) {
                moviesGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">لا توجد نتائج تطابق الخيارات المختارة.</p>';
                return;
            }

            items.forEach(item => {
                if (!item.poster_path) return;
                const title = item.title || item.name;
                const releaseYear = (item.release_date || item.first_air_date || '').substring(0, 4);

                const card = document.createElement('div');
                card.className = 'content-card';
                card.innerHTML = `
                    <div class="card-badge">${currentType === 'tv' ? 'حلقة' : 'HD'}</div>
                    <img class="poster-img" src="${IMG_URL + item.poster_path}" alt="${title}">
                    <div class="card-body">
                        <div class="card-title">${title}</div>
                        <div class="card-meta">
                            <span class="card-rating">★ ${item.vote_average ? item.vote_average.toFixed(1) : 'N/A'}</span>
                            <span>${releaseYear}</span>
                        </div>
                    </div>
                `;
                card.onclick = () => openPlayer(item);
                moviesGrid.appendChild(card);
            });
        }

        async function openPlayer(item) {
            currentItem = item;
            modalTitle.innerText = item.title || item.name;
            modalOverview.innerText = item.overview || "لا يوجد وصف متاح حالياً لهذا العمل.";
            modalMeta.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">جاري تحميل التفاصيل...</p>';
            serverSelect.value = "vidlink";

            fetchFullDetails(item.id, currentType);

            if (currentType === 'tv') {
                tvControls.style.display = 'flex';
                await loadSeasons(item.id);
            } else {
                tvControls.style.display = 'none';
                updatePlayerSrc();
            }
            movieModal.style.display = 'flex';
        }

        async function fetchFullDetails(id, type) {
            try {
                const res = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=ar-SA&append_to_response=credits`);
                const data = await res.json();

                const releaseDate = data.release_date || data.first_air_date || 'غير محدد';
                const year = releaseDate.substring(0, 4);
                
                let countries = 'غير محدد';
                if (data.production_countries && data.production_countries.length > 0) {
                    countries = data.production_countries.map(c => c.name).join('، ');
                }

                const genres = data.genres ? data.genres.map(g => g.name).join('، ') : 'غير محدد';
                let cast = data.credits && data.credits.cast ? data.credits.cast.slice(0, 6).map(c => c.name).join('، ') : 'غير متوفر';

                modalMeta.innerHTML = `
                    <div class="meta-pills">
                        <span class="meta-pill">📅 الإنتاج: ${year}</span>
                        <span class="meta-pill">⭐ التقييم: ${data.vote_average ? data.vote_average.toFixed(1) : 'N/A'}</span>
                    </div>
                    <div class="meta-row"><strong>بلد الإنتاج:</strong> ${countries}</div>
                    <div class="meta-row"><strong>التصنيف:</strong> ${genres}</div>
                    <div class="meta-row"><strong>طاقم التمثيل:</strong> ${cast}</div>
                `;
            } catch (err) {
                console.error('Error fetching details:', err);
            }
        }

        async function loadSeasons(tvId) {
            try {
                const res = await fetch(`${BASE_URL}/tv/${tvId}?api_key=${API_KEY}&language=ar-SA`);
                const data = await res.json();
                seasonSelect.innerHTML = '';
                const seasons = data.seasons ? data.seasons.filter(s => s.season_number > 0) : [];
                if (seasons.length === 0) {
                    seasonSelect.innerHTML = '<option value="1">الموسم 1</option>';
                } else {
                    seasons.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.season_number;
                        opt.innerText = s.name || `الموسم ${s.season_number}`;
                        seasonSelect.appendChild(opt);
                    });
                }
                await loadEpisodes(tvId, seasonSelect.value);
            } catch (e) {
                seasonSelect.innerHTML = '<option value="1">الموسم 1</option>';
                await loadEpisodes(tvId, 1);
            }
        }

        async function onSeasonChange() {
            if (currentItem && currentType === 'tv') {
                await loadEpisodes(currentItem.id, seasonSelect.value);
            }
        }

        async function loadEpisodes(tvId, seasonNum) {
            try {
                const res = await fetch(`${BASE_URL}/tv/${tvId}/season/${seasonNum}?api_key=${API_KEY}&language=ar-SA`);
                const data = await res.json();
                episodeSelect.innerHTML = '';
                const episodes = data.episodes || [];
                if (episodes.length === 0) {
                    for (let i = 1; i <= 20; i++) {
                        const opt = document.createElement('option');
                        opt.value = i;
                        opt.innerText = `الحلقة ${i}`;
                        episodeSelect.appendChild(opt);
                    }
                } else {
                    episodes.forEach(e => {
                        const opt = document.createElement('option');
                        opt.value = e.episode_number;
                        opt.innerText = `الحلقة ${e.episode_number}: ${e.name || ''}`;
                        episodeSelect.appendChild(opt);
                    });
                }
            } catch (e) {
                episodeSelect.innerHTML = '';
                for (let i = 1; i <= 20; i++) {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.innerText = `الحلقة ${i}`;
                    episodeSelect.appendChild(opt);
                }
            }
            updatePlayerSrc();
        }

        function updatePlayerSrc() {
            if (!currentItem) return;
            const server = serverSelect.value;
            if (currentType === 'movie') {
                if (server === 'vidlink') videoPlayer.src = `https://vidlink.pro/movie/${currentItem.id}`;
                else if (server === 'vidsrc') videoPlayer.src = `https://vidsrc.cc/v2/embed/movie/${currentItem.id}`;
                else if (server === 'vidbinge') videoPlayer.src = `https://vidbinge.dev/embed/movie/${currentItem.id}`;
                else if (server === 'embedsu') videoPlayer.src = `https://embed.su/embed/movie/${currentItem.id}`;
            } else {
                const season = seasonSelect.value || 1;
                const episode = episodeSelect.value || 1;
                if (server === 'vidlink') videoPlayer.src = `https://vidlink.pro/tv/${currentItem.id}/${season}/${episode}`;
                else if (server === 'vidsrc') videoPlayer.src = `https://vidsrc.cc/v2/embed/tv/${currentItem.id}/${season}/${episode}`;
                else if (server === 'vidbinge') videoPlayer.src = `https://vidbinge.dev/embed/tv/${currentItem.id}/${season}/${episode}`;
                else if (server === 'embedsu') videoPlayer.src = `https://embed.su/embed/tv/${currentItem.id}/${season}/${episode}`;
            }
        }

        function closeModal() {
            movieModal.style.display = 'none';
            videoPlayer.src = '';
        }

        window.onclick = function(event) {
            if (event.target === movieModal) {
                closeModal();
            }
        }

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // Initialize
        loadSliderItems();
        filterCategory('latest');
    </script>
</body>
</html>
