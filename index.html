<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodNight 🌙 | سهرة الليلة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-color: #66fcf1;
            --text-color: #ffffff;
            --text-muted: #c5c6c7;
            --gold: #f5c518;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background: rgba(11, 12, 16, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent-color);
            text-decoration: none;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border-radius: 25px;
            padding: 0.4rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            padding: 0.3rem;
            font-size: 0.95rem;
        }

        .hero {
            position: relative;
            height: 35vh;
            background: linear-gradient(to top, var(--bg-color), transparent), url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=1200') center/cover;
            display: flex;
            align-items: flex-end;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .container {
            padding: 0 2rem 3rem 2rem;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            border-right: 4px solid var(--accent-color);
            padding-right: 0.8rem;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(102, 252, 241, 0.2);
        }

        .movie-poster {
            width: 100%;
            height: 270px;
            object-fit: cover;
        }

        .movie-info {
            padding: 0.8rem;
        }

        .movie-title {
            font-size: 1rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-rating {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--gold);
            font-size: 0.85rem;
            margin-top: 0.4rem;
        }

        /* Modal Player */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 900px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            z-index: 10;
        }

        .player-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }

        .player-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        .modal-details {
            padding: 1.5rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: #060709;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">GoodNight 🌙</a>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن أي فيلم...">
        </div>
    </header>

    <section class="hero">
        <div>
            <h1 style="font-size: 2.2rem;">سهرة الليلة على GoodNight</h1>
            <p style="color: var(--text-muted);">استكشف أحدث الأفلام العالمية، واختر فيلمك المفضّل لسهرة ممتعة.</p>
        </div>
    </section>

    <div class="container">
        <h2 class="section-title" id="gridTitle">الأفلام الأكثر شعبية 🔥</h2>
        <div class="movies-grid" id="moviesGrid"></div>
    </div>

    <!-- Modal Player Window -->
    <div class="modal" id="movieModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="player-container">
                <iframe id="videoPlayer" src="" allowfullscreen></iframe>
            </div>
            <div class="modal-details">
                <h2 id="modalTitle" style="color: var(--accent-color);"></h2>
                <p id="modalOverview" style="margin-top: 0.5rem; color: var(--text-muted);"></p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 GoodNight Movies</p>
    </footer>

    <script>
        const API_KEY = 'aba2e861e0b78ab29d243dd20a9fa948'; 
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';

        const moviesGrid = document.getElementById('moviesGrid');
        const searchInput = document.getElementById('searchInput');
        const movieModal = document.getElementById('movieModal');
        const videoPlayer = document.getElementById('videoPlayer');
        const modalTitle = document.getElementById('modalTitle');
        const modalOverview = document.getElementById('modalOverview');
        const gridTitle = document.getElementById('gridTitle');

        async function fetchTrendingMovies() {
            try {
                const res = await fetch(`${BASE_URL}/trending/movie/week?api_key=${API_KEY}&language=ar-SA`);
                const data = await res.json();
                displayMovies(data.results);
            } catch (err) {
                console.error('Error fetching movies:', err);
            }
        }

        async function searchMovies(query) {
            if (!query) {
                gridTitle.innerText = "الأفلام الأكثر شعبية 🔥";
                fetchTrendingMovies();
                return;
            }
            gridTitle.innerText = `نتائج البحث عن: ${query}`;
            try {
                const res = await fetch(`${BASE_URL}/search/movie?api_key=${API_KEY}&language=ar-SA&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                displayMovies(data.results);
            } catch (err) {
                console.error('Error searching movies:', err);
            }
        }

        function displayMovies(movies) {
            moviesGrid.innerHTML = '';
            movies.forEach(movie => {
                if (!movie.poster_path) return;
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img class="movie-poster" src="${IMG_URL + movie.poster_path}" alt="${movie.title}">
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-rating">★ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'}</div>
                    </div>
                `;
                card.onclick = () => openPlayer(movie);
                moviesGrid.appendChild(card);
            });
        }

        function openPlayer(movie) {
            modalTitle.innerText = movie.title;
            modalOverview.innerText = movie.overview || "لا يوجد وصف متاح لهذا الفيلم حالياً.";
            
            // رابط المشغل المباشر
            videoPlayer.src = `https://vidsrc.to/embed/movie/${movie.id}`;
            movieModal.style.display = 'flex';
        }

        function closeModal() {
            movieModal.style.display = 'none';
            videoPlayer.src = '';
        }

        // إغلاق الشاشة المنبثقة عند الضغط خارجها
        window.onclick = function(event) {
            if (event.target === movieModal) {
                closeModal();
            }
        }

        let timer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(timer);
            timer = setTimeout(() => {
                searchMovies(e.target.value.trim());
            }, 500);
        });

        fetchTrendingMovies();
    </script>
</body>
</html>
