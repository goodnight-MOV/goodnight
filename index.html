<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodNight 🌙 | أفلام ومسلسلات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-color: #66fcf1;
            --text-color: #ffffff;
            --text-muted: #c5c6c7;
            --gold: #f5c518;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background: rgba(11, 12, 16, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent-color);
            text-decoration: none;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent-color);
            color: #000;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border-radius: 25px;
            padding: 0.4rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 300px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            padding: 0.3rem;
            font-size: 0.95rem;
        }

        /* Filter Controls Bar */
        .filter-section {
            background: #131921;
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .filter-group select {
            background: var(--card-bg);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .filter-group select:focus {
            border-color: var(--accent-color);
        }

        .container {
            padding: 2rem;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            border-right: 4px solid var(--accent-color);
            padding-right: 0.8rem;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(102, 252, 241, 0.2);
        }

        .movie-poster {
            width: 100%;
            height: 270px;
            object-fit: cover;
        }

        .movie-info {
            padding: 0.8rem;
        }

        .movie-title {
            font-size: 1rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-rating {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--gold);
            font-size: 0.85rem;
            margin-top: 0.4rem;
        }

        /* Load More Button Container */
        .load-more-container {
            text-align: center;
            margin-top: 2.5rem;
        }

        .load-more-btn {
            background: var(--card-bg);
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            padding: 0.8rem 2.5rem;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .load-more-btn:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.4);
        }

        /* Modal Player */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 900px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            z-index: 10;
        }

        .controls-bar {
            padding: 0.8rem 1.5rem;
            background: #151c24;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .controls-bar select {
            background: var(--card-bg);
            color: #fff;
            border: 1px solid var(--accent-color);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }

        .player-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }

        .player-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        .modal-details {
            padding: 1.5rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: #060709;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">GoodNight 🌙</a>
        <div class="nav-tabs">
            <button class="tab-btn active" id="moviesTab" onclick="switchType('movie')">🎬 أفلام</button>
            <button class="tab-btn" id="tvTab" onclick="switchType('tv')">📺 مسلسلات</button>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث بالاسم...">
        </div>
    </header>

    <!-- Filter Section -->
    <div class="filter-section">
        <div class="filter-group">
            <label>بلد الإنتاج:</label>
            <select id="countrySelect" onchange="applyFilters(true)">
                <option value="">جميع الدول</option>
                <option value="US">أجنبي / أمريكي 🇺🇸</option>
                <option value="KR">كوري 🇰🇷</option>
                <option value="TR">تركي 🇹🇷</option>
                <option value="IN">هندي 🇮🇳</option>
                <option value="JP">ياباني 🇯🇵</option>
                <option value="CN">صيني 🇨🇳</option>
                <option value="EG,SA,AE,KW">عربي 🇸🇦🇪🇬</option>
                <option value="GB,FR,ES,DE">أوروبي 🇪🇺</option>
            </select>
        </div>

        <div class="filter-group">
            <label>التصنيف:</label>
            <select id="genreSelect" onchange="applyFilters(true)">
                <option value="">جميع التصنيفات</option>
                <option value="28">أكشن</option>
                <option value="27">رعب</option>
                <option value="35">كوميدي</option>
                <option value="18">دراما</option>
                <option value="80">جريمة</option>
                <option value="878">خيال علمي</option>
                <option value="16">أنيميشن</option>
                <option value="10749">رومانسي</option>
                <option value="9648">غموض</option>
                <option value="53">إثارة</option>
            </select>
        </div>

        <div class="filter-group">
            <label>سنة الإنتاج:</label>
            <select id="yearSelect" onchange="applyFilters(true)">
                <option value="">جميع السنوات</option>
                <option value="2026">2026</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
                <option value="2021">2021</option>
                <option value="2020">2020</option>
                <option value="2019">2019</option>
                <option value="2018">2018</option>
            </select>
        </div>

        <div class="filter-group">
            <label>الترتيب حسب:</label>
            <select id="sortSelect" onchange="applyFilters(true)">
                <option value="popularity.desc">الأكثر شعبية 🔥</option>
                <option value="vote_average.desc">الأعلى تقييماً ⭐</option>
                <option value="primary_release_date.desc">الأحدث إصداراً 🆕</option>
            </select>
        </div>
    </div>

    <div class="container">
        <h2 class="section-title" id="gridTitle">الأفلام المعروضة 🔥</h2>
        <div class="movies-grid" id="moviesGrid"></div>
        
        <div class="load-more-container" id="loadMoreContainer">
            <button class="load-more-btn" id="loadMoreBtn" onclick="loadNextPage()">تحميل المزيد 🔄</button>
        </div>
    </div>

    <!-- Modal Player Window -->
    <div class="modal" id="movieModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="controls-bar">
                <div>
                    <label style="font-size: 0.85rem; color: var(--text-muted);">السيرفر:</label>
                    <select id="serverSelect" onchange="updatePlayerSrc()">
                        <option value="vidlink">سيرفر 1 (VidLink)</option>
                        <option value="vidsrc">سيرفر 2 (VidSrc)</option>
                        <option value="vidbinge">سيرفر 3 (VidBinge)</option>
                        <option value="embedsu">سيرفر 4 (Embed.su)</option>
                    </select>
                </div>

                <div id="tvControls" style="display: none; gap: 10px;">
                    <div>
                        <label style="font-size: 0.85rem; color: var(--text-muted);">الموسم:</label>
                        <select id="seasonSelect" onchange="onSeasonChange()"></select>
                    </div>
                    <div>
                        <label style="font-size: 0.85rem; color: var(--text-muted);">الحلقة:</label>
                        <select id="episodeSelect" onchange="updatePlayerSrc()"></select>
                    </div>
                </div>
            </div>

            <div class="player-container">
                <iframe id="videoPlayer" src="" allowfullscreen></iframe>
            </div>

            <div class="modal-details">
                <h2 id="modalTitle" style="color: var(--accent-color);"></h2>
                <p id="modalOverview" style="margin-top: 0.5rem; color: var(--text-muted);"></p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 GoodNight Movies & TV</p>
    </footer>

    <script>
        const API_KEY = 'aba2e861e0b78ab29d243dd20a9fa948'; 
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';

        let currentType = 'movie'; 
        let currentItem = null;
        let currentPage = 1;
        let isSearching = false;
        let currentSearchQuery = '';

        const moviesGrid = document.getElementById('moviesGrid');
        const searchInput = document.getElementById('searchInput');
        const movieModal = document.getElementById('movieModal');
        const videoPlayer = document.getElementById('videoPlayer');
        const modalTitle = document.getElementById('modalTitle');
        const modalOverview = document.getElementById('modalOverview');
        const gridTitle = document.getElementById('gridTitle');
        const serverSelect = document.getElementById('serverSelect');
        const seasonSelect = document.getElementById('seasonSelect');
        const episodeSelect = document.getElementById('episodeSelect');
        const tvControls = document.getElementById('tvControls');
        const moviesTab = document.getElementById('moviesTab');
        const tvTab = document.getElementById('tvTab');
        const countrySelect = document.getElementById('countrySelect');
        const genreSelect = document.getElementById('genreSelect');
        const yearSelect = document.getElementById('yearSelect');
        const sortSelect = document.getElementById('sortSelect');
        const loadMoreContainer = document.getElementById('loadMoreContainer');

        function switchType(type) {
            currentType = type;
            searchInput.value = '';
            countrySelect.value = '';
            genreSelect.value = '';
            yearSelect.value = '';
            sortSelect.value = 'popularity.desc';

            if (type === 'movie') {
                moviesTab.classList.add('active');
                tvTab.classList.remove('active');
                gridTitle.innerText = "الأفلام المعروضة 🔥";
            } else {
                tvTab.classList.add('active');
                moviesTab.classList.remove('active');
                gridTitle.innerText = "المسلسلات المعروضة 🔥";
            }
            applyFilters(true);
        }

        async function applyFilters(reset = true) {
            isSearching = false;
            if (reset) {
                currentPage = 1;
                moviesGrid.innerHTML = '';
            }

            const country = countrySelect.value;
            const genre = genreSelect.value;
            const year = yearSelect.value;
            const sort = sortSelect.value;

            let url = `${BASE_URL}/discover/${currentType}?api_key=${API_KEY}&language=ar-SA&include_adult=false&sort_by=${sort}&page=${currentPage}`;
            
            if (country) url += `&with_origin_country=${country}`;
            if (genre) url += `&with_genres=${genre}`;
            if (year) {
                if (currentType === 'movie') url += `&primary_release_year=${year}`;
                else url += `&first_air_date_year=${year}`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                displayItems(data.results, reset);
                toggleLoadMore(data.page < data.total_pages);
            } catch (err) {
                console.error('Error applying filters:', err);
            }
        }

        async function searchItems(query, reset = true) {
            isSearching = true;
            currentSearchQuery = query;

            if (!query) {
                applyFilters(true);
                return;
            }

            if (reset) {
                currentPage = 1;
                moviesGrid.innerHTML = '';
            }

            gridTitle.innerText = `نتائج البحث عن: ${query}`;
            try {
                const res = await fetch(`${BASE_URL}/search/${currentType}?api_key=${API_KEY}&language=ar-SA&query=${encodeURIComponent(query)}&page=${currentPage}&include_adult=false`);
                const data = await res.json();
                displayItems(data.results, reset);
                toggleLoadMore(data.page < data.total_pages);
            } catch (err) {
                console.error('Error searching:', err);
            }
        }

        function loadNextPage() {
            currentPage++;
            if (isSearching) {
                searchItems(currentSearchQuery, false);
            } else {
                applyFilters(false);
            }
        }

        function toggleLoadMore(hasMore) {
            loadMoreContainer.style.display = hasMore ? 'block' : 'none';
        }

        function displayItems(items, reset = true) {
            if (reset && (!items || items.length === 0)) {
                moviesGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">لا توجد نتائج تطابق الخيارات المختارة.</p>';
                return;
            }

            items.forEach(item => {
                if (!item.poster_path) return;
                const title = item.title || item.name;
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img class="movie-poster" src="${IMG_URL + item.poster_path}" alt="${title}">
                    <div class="movie-info">
                        <div class="movie-title">${title}</div>
                        <div class="movie-rating">★ ${item.vote_average ? item.vote_average.toFixed(1) : 'N/A'}</div>
                    </div>
                `;
                card.onclick = () => openPlayer(item);
                moviesGrid.appendChild(card);
            });
        }

        async function openPlayer(item) {
            currentItem = item;
            modalTitle.innerText = item.title || item.name;
            modalOverview.innerText = item.overview || "لا يوجد وصف متاح حالياً.";
            serverSelect.value = "vidlink";

            if (currentType === 'tv') {
                tvControls.style.display = 'flex';
                await loadSeasons(item.id);
            } else {
                tvControls.style.display = 'none';
                updatePlayerSrc();
            }
            movieModal.style.display = 'flex';
        }

        async function loadSeasons(tvId) {
            try {
                const res = await fetch(`${BASE_URL}/tv/${tvId}?api_key=${API_KEY}&language=ar-SA`);
                const data = await res.json();
                seasonSelect.innerHTML = '';
                const seasons = data.seasons ? data.seasons.filter(s => s.season_number > 0) : [];
                if (seasons.length === 0) {
                    seasonSelect.innerHTML = '<option value="1">الموسم 1</option>';
                } else {
                    seasons.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.season_number;
                        opt.innerText = s.name || `الموسم ${s.season_number}`;
                        seasonSelect.appendChild(opt);
                    });
                }
                await loadEpisodes(tvId, seasonSelect.value);
            } catch (e) {
                seasonSelect.innerHTML = '<option value="1">الموسم 1</option>';
                await loadEpisodes(tvId, 1);
            }
        }

        async function onSeasonChange() {
            if (currentItem && currentType === 'tv') {
                await loadEpisodes(currentItem.id, seasonSelect.value);
            }
        }

        async function loadEpisodes(tvId, seasonNum) {
            try {
                const res = await fetch(`${BASE_URL}/tv/${tvId}/season/${seasonNum}?api_key=${API_KEY}&language=ar-SA`);
                const data = await res.json();
                episodeSelect.innerHTML = '';
                const episodes = data.episodes || [];
                if (episodes.length === 0) {
                    for (let i = 1; i <= 20; i++) {
                        const opt = document.createElement('option');
                        opt.value = i;
                        opt.innerText = `الحلقة ${i}`;
                        episodeSelect.appendChild(opt);
                    }
                } else {
                    episodes.forEach(e => {
                        const opt = document.createElement('option');
                        opt.value = e.episode_number;
                        opt.innerText = `الحلقة ${e.episode_number}: ${e.name || ''}`;
                        episodeSelect.appendChild(opt);
                    });
                }
            } catch (e) {
                episodeSelect.innerHTML = '';
                for (let i = 1; i <= 20; i++) {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.innerText = `الحلقة ${i}`;
                    episodeSelect.appendChild(opt);
                }
            }
            updatePlayerSrc();
        }

        function updatePlayerSrc() {
            if (!currentItem) return;
            const server = serverSelect.value;
            if (currentType === 'movie') {
                if (server === 'vidlink') videoPlayer.src = `https://vidlink.pro/movie/${currentItem.id}`;
                else if (server === 'vidsrc') videoPlayer.src = `https://vidsrc.cc/v2/embed/movie/${currentItem.id}`;
                else if (server === 'vidbinge') videoPlayer.src = `https://vidbinge.dev/embed/movie/${currentItem.id}`;
                else if (server === 'embedsu') videoPlayer.src = `https://embed.su/embed/movie/${currentItem.id}`;
            } else {
                const season = seasonSelect.value || 1;
                const episode = episodeSelect.value || 1;
                if (server === 'vidlink') videoPlayer.src = `https://vidlink.pro/tv/${currentItem.id}/${season}/${episode}`;
                else if (server === 'vidsrc') videoPlayer.src = `https://vidsrc.cc/v2/embed/tv/${currentItem.id}/${season}/${episode}`;
                else if (server === 'vidbinge') videoPlayer.src = `https://vidbinge.dev/embed/tv/${currentItem.id}/${season}/${episode}`;
                else if (server === 'embedsu') videoPlayer.src = `https://embed.su/embed/tv/${currentItem.id}/${season}/${episode}`;
            }
        }

        function closeModal() {
            movieModal.style.display = 'none';
            videoPlayer.src = '';
        }

        window.onclick = function(event) {
            if (event.target === movieModal) {
                closeModal();
            }
        }

        let timer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(timer);
            timer = setTimeout(() => {
                searchItems(e.target.value.trim(), true);
            }, 500);
        });

        applyFilters(true);
    </script>
</body>
</html>
